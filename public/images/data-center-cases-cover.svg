<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Server racks under a cyan glow">
  <defs>
    <linearGradient id="dcc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1117"/>
      <stop offset="1" stop-color="#070809"/>
    </linearGradient>
    <radialGradient id="dcc-glow" cx="76%" cy="12%" r="62%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dcc-rack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18212a"/>
      <stop offset="1" stop-color="#0d1318"/>
    </linearGradient>
    <pattern id="dcc-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <g id="dcc-rk">
      <rect width="120" height="320" rx="7" fill="url(#dcc-rack)" stroke="#22d3ee" stroke-opacity="0.28" stroke-width="1.5"/>
      <rect x="0" y="0" width="120" height="6" rx="3" fill="#22d3ee" opacity="0.55"/>
      <g fill="#0a0e12" stroke="#ffffff" stroke-opacity="0.07">
        <rect x="12" y="24" width="96" height="16" rx="2"/>
        <rect x="12" y="48" width="96" height="16" rx="2"/>
        <rect x="12" y="72" width="96" height="16" rx="2"/>
        <rect x="12" y="96" width="96" height="16" rx="2"/>
        <rect x="12" y="120" width="96" height="16" rx="2"/>
        <rect x="12" y="144" width="96" height="16" rx="2"/>
        <rect x="12" y="168" width="96" height="16" rx="2"/>
        <rect x="12" y="192" width="96" height="16" rx="2"/>
        <rect x="12" y="216" width="96" height="16" rx="2"/>
        <rect x="12" y="240" width="96" height="16" rx="2"/>
        <rect x="12" y="264" width="96" height="16" rx="2"/>
        <rect x="12" y="288" width="96" height="16" rx="2"/>
      </g>
      <g>
        <circle cx="100" cy="32" r="2.6" fill="#22d3ee"/>
        <circle cx="100" cy="104" r="2.6" fill="#5eead4"/>
        <circle cx="100" cy="200" r="2.6" fill="#f59e0b"/>
        <circle cx="100" cy="272" r="2.6" fill="#22d3ee"/>
        <circle cx="20" cy="56" r="2.2" fill="#22d3ee" opacity="0.8"/>
        <circle cx="20" cy="152" r="2.2" fill="#22d3ee" opacity="0.6"/>
      </g>
    </g>
  </defs>

  <rect width="1200" height="675" fill="url(#dcc-bg)"/>
  <rect width="1200" height="675" fill="url(#dcc-grid)"/>
  <rect width="1200" height="675" fill="url(#dcc-glow)"/>

  <rect x="0" y="518" width="1200" height="2" fill="#22d3ee" opacity="0.5"/>
  <ellipse cx="600" cy="520" rx="420" ry="60" fill="#22d3ee" opacity="0.08"/>

  <use href="#dcc-rk" x="315" y="200"/>
  <use href="#dcc-rk" x="465" y="200"/>
  <use href="#dcc-rk" x="615" y="200"/>
  <use href="#dcc-rk" x="765" y="200"/>

  <rect x="0" y="560" width="1200" height="115" fill="#070809"/>
